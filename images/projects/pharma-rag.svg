<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Pharma Document Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 90 H800 M0 180 H800 M0 270 H800 M0 360 H800"/>
    <path d="M100 0 V450 M250 0 V450 M400 0 V450 M550 0 V450 M700 0 V450"/>
  </g>

  <!-- Document mock -->
  <g filter="url(#shadow)" transform="translate(80,70)">
    <rect width="260" height="310" rx="10" fill="url(#doc)"/>
    <rect x="20" y="22" width="160" height="14" rx="3" fill="#1d4ed8"/>
    <rect x="20" y="48" width="220" height="6" rx="2" fill="#94a3b8"/>
    <rect x="20" y="62" width="200" height="6" rx="2" fill="#94a3b8"/>
    <rect x="20" y="76" width="180" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="20" y="100" width="220" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="20" y="114" width="160" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Highlighted retrieved chunk -->
    <rect x="14" y="142" width="232" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="24" y="154" width="180" height="6" rx="2" fill="#1d4ed8"/>
    <rect x="24" y="168" width="210" height="6" rx="2" fill="#1d4ed8" opacity="0.7"/>
    <rect x="24" y="182" width="120" height="6" rx="2" fill="#1d4ed8" opacity="0.5"/>
    <rect x="20" y="216" width="220" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="20" y="230" width="190" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="20" y="244" width="210" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="20" y="268" width="80" height="14" rx="3" fill="#10b981"/>
  </g>

  <!-- Arrow / retrieval line -->
  <path d="M360 220 C 410 220, 410 200, 470 200" stroke="#10b981" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <circle cx="470" cy="200" r="6" fill="#10b981"/>

  <!-- Chat panel mock -->
  <g filter="url(#shadow)" transform="translate(470,70)">
    <rect width="260" height="310" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <rect x="14" y="16" width="120" height="10" rx="3" fill="#7dd3fc"/>
    <rect x="14" y="32" width="200" height="6" rx="2" fill="#475569"/>

    <!-- user bubble -->
    <rect x="60" y="60" width="180" height="44" rx="10" fill="#1d4ed8"/>
    <rect x="72" y="76" width="120" height="6" rx="2" fill="#ffffff"/>
    <rect x="72" y="88" width="140" height="6" rx="2" fill="#ffffff" opacity="0.8"/>

    <!-- assistant bubble -->
    <rect x="18" y="118" width="200" height="86" rx="10" fill="#1e293b"/>
    <rect x="30" y="132" width="150" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="30" y="146" width="170" height="6" rx="2" fill="#e2e8f0" opacity="0.8"/>
    <rect x="30" y="160" width="120" height="6" rx="2" fill="#e2e8f0" opacity="0.7"/>
    <rect x="30" y="180" width="60" height="14" rx="4" fill="#10b981"/>
    <text x="42" y="191" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#0b1220" font-weight="700">p.1, 2</text>

    <!-- input -->
    <rect x="14" y="240" width="232" height="44" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="28" y="258" width="140" height="8" rx="3" fill="#64748b"/>
    <rect x="190" y="250" width="46" height="24" rx="6" fill="#1d4ed8"/>
  </g>

  <!-- Title -->
  <text x="40" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Pharma Document Intelligence</text>
  <text x="40" y="440" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1">Hybrid RAG · Mistral 7B · Grounded answers</text>
</svg>
