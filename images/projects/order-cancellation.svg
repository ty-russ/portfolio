<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Order Cancellation Intelligence">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- KPI strip -->
  <g filter="url(#shadow2)">
    <rect x="40" y="40" width="170" height="78" rx="10" fill="#ffffff"/>
    <text x="56" y="68" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1">ORDERS PLACED</text>
    <text x="56" y="100" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#0f172a" font-weight="700">289,446</text>

    <rect x="220" y="40" width="170" height="78" rx="10" fill="#ffffff"/>
    <text x="236" y="68" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1">UNITS CANCELLED</text>
    <text x="236" y="100" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#0f172a" font-weight="700">12,432</text>

    <rect x="400" y="40" width="170" height="78" rx="10" fill="#ffffff"/>
    <text x="416" y="68" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1">CANCEL RATE</text>
    <text x="416" y="100" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#1d4ed8" font-weight="700">4.3%</text>

    <rect x="580" y="40" width="180" height="78" rx="10" fill="#ffffff"/>
    <text x="596" y="68" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1">REVENUE AT RISK</text>
    <text x="596" y="100" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#10b981" font-weight="700">$56,289</text>
  </g>

  <!-- Chart panel -->
  <g filter="url(#shadow2)" transform="translate(40,140)">
    <rect width="430" height="240" rx="12" fill="#ffffff"/>
    <text x="20" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Weekly Cancellation Trend</text>
    <text x="20" y="48" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">Units &amp; Revenue at Risk</text>

    <!-- Axes -->
    <line x1="40" y1="200" x2="410" y2="200" stroke="#e2e8f0"/>
    <line x1="40" y1="70" x2="40" y2="200" stroke="#e2e8f0"/>

    <!-- Bars -->
    <g>
      <rect x="55" y="150" width="14" height="50" rx="2" fill="url(#bar)"/>
      <rect x="75" y="105" width="14" height="95" rx="2" fill="url(#bar)"/>
      <rect x="95" y="142" width="14" height="58" rx="2" fill="url(#bar)"/>
      <rect x="115" y="155" width="14" height="45" rx="2" fill="url(#bar)"/>
      <rect x="135" y="130" width="14" height="70" rx="2" fill="url(#bar)"/>
      <rect x="155" y="118" width="14" height="82" rx="2" fill="url(#bar)"/>
      <rect x="175" y="140" width="14" height="60" rx="2" fill="url(#bar)"/>
      <rect x="195" y="92" width="14" height="108" rx="2" fill="url(#bar)"/>
      <rect x="215" y="120" width="14" height="80" rx="2" fill="url(#bar)"/>
      <rect x="235" y="135" width="14" height="65" rx="2" fill="url(#bar)"/>
      <rect x="255" y="160" width="14" height="40" rx="2" fill="url(#bar)"/>
      <rect x="275" y="125" width="14" height="75" rx="2" fill="url(#bar)"/>
      <rect x="295" y="118" width="14" height="82" rx="2" fill="url(#bar)"/>
      <rect x="315" y="128" width="14" height="72" rx="2" fill="url(#bar)"/>
      <rect x="335" y="110" width="14" height="90" rx="2" fill="url(#bar)"/>
      <rect x="355" y="98" width="14" height="102" rx="2" fill="url(#bar)"/>
      <rect x="375" y="115" width="14" height="85" rx="2" fill="url(#bar)"/>
    </g>

    <!-- Revenue line overlay -->
    <polyline fill="none" stroke="#ef4444" stroke-width="2.5"
      points="62,170 82,135 102,155 122,162 142,140 162,128 182,148 202,108 222,130 242,150 262,170 282,135 302,128 322,140 342,118 362,108 382,124"/>
    <g fill="#ef4444">
      <circle cx="62" cy="170" r="2.5"/><circle cx="82" cy="135" r="2.5"/><circle cx="102" cy="155" r="2.5"/>
      <circle cx="122" cy="162" r="2.5"/><circle cx="142" cy="140" r="2.5"/><circle cx="162" cy="128" r="2.5"/>
      <circle cx="182" cy="148" r="2.5"/><circle cx="202" cy="108" r="2.5"/><circle cx="222" cy="130" r="2.5"/>
      <circle cx="242" cy="150" r="2.5"/><circle cx="262" cy="170" r="2.5"/><circle cx="282" cy="135" r="2.5"/>
      <circle cx="302" cy="128" r="2.5"/><circle cx="322" cy="140" r="2.5"/><circle cx="342" cy="118" r="2.5"/>
      <circle cx="362" cy="108" r="2.5"/><circle cx="382" cy="124" r="2.5"/>
    </g>

    <!-- Legend -->
    <rect x="280" y="216" width="10" height="10" fill="#1d4ed8"/>
    <text x="294" y="225" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#475569">Units</text>
    <rect x="330" y="216" width="10" height="10" fill="#ef4444"/>
    <text x="344" y="225" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#475569">Revenue $</text>
  </g>

  <!-- Top reasons panel -->
  <g filter="url(#shadow2)" transform="translate(490,140)">
    <rect width="270" height="240" rx="12" fill="#ffffff"/>
    <text x="20" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Top Cancel Reasons</text>

    <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569">
      <text x="20" y="64">Out of Stock</text>
      <rect x="20" y="70" width="220" height="12" rx="3" fill="#1d4ed8"/>
      <text x="20" y="100">Customer</text>
      <rect x="20" y="106" width="200" height="12" rx="3" fill="#2563eb"/>
      <text x="20" y="136">Rejected Sub.</text>
      <rect x="20" y="142" width="110" height="12" rx="3" fill="#3b82f6"/>
      <text x="20" y="172">Expired</text>
      <rect x="20" y="178" width="85" height="12" rx="3" fill="#60a5fa"/>
      <text x="20" y="208">Fraud</text>
      <rect x="20" y="214" width="50" height="12" rx="3" fill="#93c5fd"/>
    </g>
  </g>

  <!-- Title overlay -->
  <text x="40" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Order Cancellation Intelligence</text>
  <text x="40" y="440" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1">Retail analytics · FastAPI · Multi-LLM insights</text>
</svg>
